            - heading "Mach Jobs" [level=3] [ref=e334]
            - paragraph [ref=e335]: "Full-stack job search web app with AI-powered matching. The user imports their CV (PDF/Markdown/txt or text) and the app structures it as a profile, aggregates real job postings from Argentina via the official APIs of job aggregators (Careerjet and Jooble), avoiding portal scraping and thus respecting each platform's terms and conditions (ToS), and scores each posting against the profile with a fit score based on (matching skills, missing skills and justification). Job offers are sorted by likelihood of success and the user can open the original posting with a click to apply, marking the status (new/seen/discarded/applied). Stack: Angular 22 (frontend) · Node + Express in TypeScript (backend) · MongoDB Atlas in production and SQLite for local development · AI with Groq (free tier, pluggable) · serverless deployment on Vercel."
