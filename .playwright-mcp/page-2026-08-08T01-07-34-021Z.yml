              - heading [level=3] [ref=f1e162]: Mach Jobs
              - paragraph [ref=f1e78]: "Aplicación web full-stack de búsqueda de empleo con matching por IA. El usuario importa su CV (PDF/Markdown/txt o texto) y la app lo estructura como perfil, agrega ofertas laborales reales de Argentina vía las APIs oficiales de agregadores de empleo (Careerjet y Jooble), evitando el scraping de portales y respetando así los términos y condiciones (ToS) de cada plataforma, y puntúa cada oferta contra su perfil con un score de ajuste según (skills que coinciden, faltantes y justificación). Las ofertas se ordenan por probabilidad de éxito y el usuario puede abrir la oferta original con un clic para postularse, marcando el estado (nueva/vista/descartada/postulada). Stack: Angular 22 (frontend) · Node + Express en TypeScript (backend) · MongoDB Atlas en producción y SQLite para desarrollo local · IA con Groq (free tier, enchufable) · despliegue serverless en Vercel."
              - button [ref=f1e163] [cursor=pointer]: Ver más...
